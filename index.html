<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسكربت أبو علاء</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030008;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* الإطار الخارجي المتوهج */
        .app-wrapper {
            width: 100%;
            max-width: 360px;
            background: #090214;
            border: 2px solid #6b17c7;
            border-radius: 28px;
            padding: 20px 14px;
            box-shadow: 0 0 15px rgba(107, 23, 199, 0.45), inset 0 0 15px rgba(107, 23, 199, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* عنوان الصفحة الرئيسي المتوهج */
        .main-title {
            font-size: 24px;
            font-weight: 700;
            color: #e5b8ff;
            text-shadow: 0 0 12px #9d4edd, 0 0 25px #7b2cbf;
            margin-bottom: 20px;
            text-align: center;
        }

        /* ================== شاشة تسجيل الدخول ================== */
        #login-view {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .login-card {
            width: 100%;
            border: 1.5px solid #5513a0;
            border-radius: 20px;
            padding: 24px 16px;
            background: rgba(14, 3, 30, 0.85);
            box-shadow: inset 0 0 10px rgba(107, 23, 199, 0.2);
        }

        .field-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .field-label {
            font-size: 13px;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: right;
            padding-right: 4px;
        }

        .field-input {
            width: 100%;
            height: 48px;
            background: #0c041c;
            border: 1.5px solid #5a19a8;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-input:focus {
            border-color: #9d4edd;
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.5);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            background: #140529;
            border: 1.5px solid #6b17c7;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            background: #230947;
            box-shadow: 0 0 12px rgba(107, 23, 199, 0.6);
        }

        .author-tag {
            text-align: center;
            font-size: 13px;
            color: #9283a8;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }

        /* ================== شاشة اللعبة ================== */
        #game-view {
            width: 100%;
            display: none;
            flex-direction: column;
        }

        /* شريطي المعلومات العلويين */
        .status-header {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 14px;
        }

        .info-pill {
            flex: 1;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0217;
            border: 1.5px solid #5513a0;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            direction: ltr;
        }

        /* الصندوق المحيط بالدوائر */
        .board-container {
            width: 100%;
            border: 1.5px solid #5513a0;
            border-radius: 18px;
            padding: 10px 8px;
            background: #070110;
        }

        .rows-wrapper {
            display: flex;
            flex-direction: column-reverse; /* ترتيب الصف الأول ليكون في الأسفل */
            gap: 4.5px;
        }

        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cells-group {
            display: flex;
            gap: 5px;
        }

        /* الدائرة المخططة كما بالصورة الأصلية */
        .circle-token {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: repeating-linear-gradient(
                180deg,
                #d38a45 0px,
                #d38a45 6px,
                #85471d 6px,
                #85471d 12px
            );
            border: 1.5px solid #4a230c;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        /* التأثير عند كشف الخلية الآمنة */
        .circle-token.highlighted {
            background: radial-gradient(circle, #20c997, #0e5e45) !important;
            border-color: #51f5c3 !important;
            box-shadow: 0 0 10px #20c997;
        }

        /* المضاعف والنجمة الوردية */
        .multiplier-tag {
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            min-width: 65px;
            direction: ltr;
        }

        .multiplier-tag .icon {
            color: #e63956;
            font-size: 12px;
        }

        /* أزرار التحكم بالأسفل */
        .actions-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 14px;
        }

        .action-btn {
            flex: 1;
            height: 44px;
            background: #0b0217;
            border: 1.5px solid #5513a0;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .action-btn:hover {
            background: #1b0736;
            box-shadow: 0 0 10px rgba(107, 23, 199, 0.4);
        }

        .footer-note {
            margin-top: 10px;
            font-size: 11px;
            color: #9283a8;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- شاشة تسجيل الدخول المطابقة تماماً -->
    <div id="login-view">
        <div class="main-title">اسكربت أبو علاء</div>
        <div class="login-card">
            <div class="field-group">
                <label class="field-label">ID</label>
                <input type="text" id="idInput" class="field-input" value="55255347622">
            </div>

            <div class="field-group">
                <label class="field-label">كلمة السر</label>
                <input type="password" id="passInput" class="field-input" placeholder="••••••••">
            </div>

            <button class="btn-login" onclick="authenticate()">دخول</button>
        </div>
        <div class="author-tag">صنع بواسطة MOHAMED ALAA</div>
    </div>

    <!-- شاشة التوقعات وشبكة اللعبة المطابقة تماماً -->
    <div id="game-view">
        <div class="main-title">اسكربت أبو علاء</div>

        <div class="status-header">
            <div class="info-pill" id="idLabel">Your ID: 55255347622</div>
            <div class="info-pill">Online Users: 204</div>
        </div>

        <div class="board-container">
            <div class="rows-wrapper" id="boardRows"></div>
        </div>

        <div class="actions-group">
            <button class="action-btn" onclick="resetBoard()">RESET</button>
            <button class="action-btn" onclick="runSimulation()">START</button>
        </div>

        <div class="footer-note">تمت إعادة التفعيلات للموقع واللعبة</div>
    </div>

</div>

<script>
    const ROWS_COUNT = 10;
    const COLS_COUNT = 5;
    const MULTIPLIERS = [
        "x1.23", "x1.54", "x1.93", "x2.41", "x4.02",
        "x6.71", "x11.18", "x27.97", "x69.93", "x349.68"
    ];

    function authenticate() {
        const enteredId = document.getElementById('idInput').value.trim();
        if (enteredId) {
            document.getElementById('idLabel').textContent = 'Your ID: ' + enteredId;
        }
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('boardRows');
        board.innerHTML = '';

        for (let r = 0; r < ROWS_COUNT; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row-item';

            const cellsDiv = document.createElement('div');
            cellsDiv.className = 'cells-group';

            for (let c = 0; c < COLS_COUNT; c++) {
                const token = document.createElement('div');
                token.className = 'circle-token';
                token.id = `token-${r}-${c}`;
                cellsDiv.appendChild(token);
            }

            const multDiv = document.createElement('div');
            multDiv.className = 'multiplier-tag';
            multDiv.innerHTML = `${MULTIPLIERS[r]} <span class="icon">✿</span>`;

            rowDiv.appendChild(cellsDiv);
            rowDiv.appendChild(multDiv);
            board.appendChild(rowDiv);
        }
    }

    function resetBoard() {
        renderBoard();
    }

    function runSimulation() {
        resetBoard();
        let rowIdx = 0;

        const interval = setInterval(() => {
            if (rowIdx >= ROWS_COUNT) {
                clearInterval(interval);
                return;
            }

            // اختيار مسار عشوائي لكل صف
            const safeCol = Math.floor(Math.random() * COLS_COUNT);
            const token = document.getElementById(`token-${rowIdx}-${safeCol}`);
            if (token) {
                token.classList.add('highlighted');
                token.innerHTML = '🍏';
            }

            rowIdx++;
        }, 220);
    }
</script>

</body>
</html>
